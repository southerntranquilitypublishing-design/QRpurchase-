;grid-template-columns:repeat(3,1fr);gap:1.3%}.choice{border:0;border-radius:14px;background:transparent;color:transparent;cursor:pointer;font-size:0}.choice:hover{box-shadow:inset 0 0 0 3px #fff9}.fallback{display:none;padding:20px;text-align:center}.fallback button{margin:6px;padding:12px;border-radius:7px}.skip{margin:0 0 14px;text-align:center}.skip button{color:#fff;background:transparent;border:0;text-decoration:underline;cursor:pointer;font:13px system-ui,sans-serif}@media(max-width:450px){.purchase{padding:0 12px 20px}.buttons{gap:9px}.buy{padding:12px 5px;min-height:68px}.modal-head{font-size:12px}.survey-choices{top:42%;height:48%}}@media(prefers-reduced-motion:no-preference){.buy{transition:filter .15s,transform .15s}.buy:active{transform:translateY(3px)}}

<body>
<main class="wrap">
<img class="poster" src="PP.png" alt="8:01 — Collisions of Time by Dixon Davis. An atmospheric winter forest book cover, reader reviews, and story description." fetchpriority="high">
<section class="purchase" aria-label="Purchase options">
<h1>CHOOSE YOUR EDITION</h1>
<div class="buttons"><button class="buy" type="button" data-format="paperback">Paperback<br>$19.99</button><button class="buy digital" type="button" data-format="kindle">Kindle<br>$12.99</button></div>
<p class="note">Purchases are completed on Amazon. Prices shown are promotional page labels; Amazon's current checkout price applies.</p>
</section>
<footer class="footer">A novel by Dixon Davis · <a href="https://authordixondavis.github.io/">Author website</a></footer>
</main>
<dialog id="survey" aria-labelledby="surveyTitle">
<div class="modal-head"><span id="surveyTitle">One quick question before Amazon</span><button type="button" class="close" id="closeSurvey" aria-label="Close survey">✕</button></div>
<div class="survey"><img src="SV.png" alt="Before you purchase: How did you learn of Dixon Davis and 8:01? A Book Promoter, B Another Reader, C Television Ad." onerror="this.parentNode.classList.add('missing-image')"><div class="survey-choices"><button type="button" class="choice" data-answer="book_promoter" aria-label="A: Book Promoter">Book Promoter</button><button type="button" class="choice" data-answer="another_reader" aria-label="B: Another Reader">Another Reader</button><button type="button" class="choice" data-answer="television_ad" aria-label="C: Television Ad">Television Ad</button></div></div>
<div class="skip"><button type="button" id="skipSurvey">Skip question and continue to Amazon</button></div>
</dialog>
<script>
(function(){
'use strict';
const AMAZON={paperback:'https://a.co/d/03efUWc0',kindle:'https://a.co/d/09Iw2Ac6'};
const params=new URLSearchParams(location.search);
const clean=v=>String(v||'').slice(0,80).replace(/[^a-zA-Z0-9_\-.]/g,'');
const campaign=clean(params.get('ref')||params.get('utm_campaign')||'direct');
const source=clean(params.get('utm_source')||'unknown');
const modal=document.getElementById('survey');
let format=null;
function track(name,extras){try{if(typeof gtag==='function')gtag('event',name,Object.assign({campaign_id:campaign,traffic_source:source,book_id:'801_collisions_of_time'},extras||{}))}catch(e){}}
track('qr_landing_view',{page_path:location.pathname});
document.querySelectorAll('[data-format]').forEach(b=>b.addEventListener('click',()=>{
format=b.dataset.format;
track('purchase_intent',{book_format:format});
if(typeof modal.showModal==='function')modal.showModal();else {modal.setAttribute('open','');}
}));
function proceed(answer){
if(!format)return;
const selected=format;format=null;
track('referral_survey_response',{book_format:selected,survey_answer:answer});
track('amazon_outbound_click',{book_format:selected,survey_answer:answer,link_url:AMAZON[selected],transport_type:'beacon'});
modal.close&&modal.close();
window.location.assign(AMAZON[selected]);
}
document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>proceed(b.dataset.answer)));
document.getElementById('skipSurvey').addEventListener('click',()=>proceed('skipped'));
document.getElementById('closeSurvey').addEventListener('click',()=>{track('referral_survey_dismissed',{book_format:format});modal.close();format=null});
modal.addEventListener('cancel',()=>{track('referral_survey_dismissed',{book_format:format});format=null});
})();
</script>
