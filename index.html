<script>
(function(){
'use strict';
const AMAZON={paperback:'https://a.co/d/03efUWc0',kindle:'https://a.co/d/09Iw2Ac6'};
const params=new URLSearchParams(location.search);
const clean=v=>String(v||'').slice(0,80).replace(/[^a-zA-Z0-9_.-]/g,'');
const campaign=clean(params.get('ref')||params.get('utm_campaign')||'direct');
const source=clean(params.get('utm_source')||'unknown');
const stage=document.getElementById('surveyStage'),purchase=document.getElementById('purchase');
let answer=null;
function track(name,extras){try{if(typeof gtag==='function')gtag('event',name,Object.assign({campaign_id:campaign,traffic_source:source,book_id:'801_collisions_of_time'},extras||{}))}catch(e){}}
track('qr_landing_view',{page_path:location.pathname});
document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{
answer=b.dataset.answer;
track('referral_survey_response',{survey_answer:answer});
stage.hidden=true;purchase.hidden=false;
purchase.scrollIntoView({block:'center',behavior:'instant'});
}));
document.querySelectorAll('[data-format]').forEach(b=>b.addEventListener('click',()=>{
if(!answer)return;
const format=b.dataset.format;
track('purchase_intent',{book_format:format,survey_answer:answer});
track('amazon_outbound_click',{book_format:format,survey_answer:answer,link_url:AMAZON[format],transport_type:'beacon'});
window.location.assign(AMAZON[format]);
}));
})();
</script>
